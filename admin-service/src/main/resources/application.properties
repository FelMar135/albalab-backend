spring.application.name=admin-service
server.port=${SERVER_PORT:9092}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:albalab_admin}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql

jwt.secret=${JWT_SECRET:esta_es_mi_compleja_clave_secreta}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
