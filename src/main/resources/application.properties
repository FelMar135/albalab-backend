spring.application.name=backend
server.port=9091
# Conexión a la base de datos (creará la base de datos 'albalab_db' automáticamente si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/albalab_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate (crea las tablas automáticamente en base a tu código Java)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true