server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: usuario-service
              uri: ${USUARIO_SERVICE_URI:http://localhost:9091}
              predicates:
                - Path=/api/auth/**,/api/usuarios/**

            - id: admin-service
              uri: ${ADMIN_SERVICE_URI:http://localhost:9092}
              predicates:
                - Path=/api/admin/**

            - id: colaborador-service
              uri: ${COLABORADOR_SERVICE_URI:http://localhost:9093}
              predicates:
                - Path=/api/colaboradores/**

            - id: product-service
              uri: ${PRODUCT_SERVICE_URI:http://localhost:9095}
              predicates:
                - Path=/api/productos/**

            - id: webpay-service
              uri: ${WEBPAY_SERVICE_URI:http://localhost:9094}
              predicates:
                - Path=/api/webpay/**

            - id: historial-service
              uri: ${HISTORIAL_SERVICE_URI:http://localhost:9096}
              predicates:
                - Path=/api/historial/**

jwt:
  secret: ${JWT_SECRET:esta_es_mi_compleja_clave_secreta}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
