spring.application.name=webpay-service
server.port=${SERVER_PORT:9094}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:albalab_webpay}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:esta_es_mi_compleja_clave_secreta}

# Credenciales de integracion Webpay Plus.
# Si se dejan vacias se usan las credenciales publicas de TEST de Transbank.
webpay.commerce-code=${WEBPAY_COMMERCE_CODE:}
webpay.api-key=${WEBPAY_API_KEY:}
webpay.environment=${WEBPAY_ENVIRONMENT:TEST}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
