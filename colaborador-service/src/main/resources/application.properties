spring.application.name=colaborador-service
server.port=${SERVER_PORT:9093}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:albalab_colaboradores}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:esta_es_mi_compleja_clave_secreta}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
